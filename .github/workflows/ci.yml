name: Python CI 

on: 
  push:
    branches:
      - "**"
  
  pull_request:
    branches:
      - main
    
  workflow_dispatch:

  permissions:
    contents: read 

  concurrency:
    group: ci-${{ github.workflow}}-${{github.ref}}
    cancel-in-progress: true

  
  jobs:
    test: 
      name: Test - Python 3.12
      runs-on: ubuntu-latest
      timeout-minuntes: 10

      steps:
        - name: Checkout repository 
          uses: actions/checkout@v6

        - name: Set up Python
          uses: actions/setup-python@v6
          with:
            python-version: "3.12"
            cache: pip 
            cache-dependency-path: |
              requirement.txt
              requirement-dev.txt 

        - name: Upgrade pip 
          run: python -m pip install --Upgrade pip 

        - name: Install dependencies
          run: python -m install -r requirement-dev.txt 

        - name: Run tests
          env:
            PYTHONPATH: .
          run: python -m pytest -v 