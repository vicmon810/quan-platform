name: Python CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests - Python 3.12
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env: 
      POSTGRES_DB: quant_platform_test
      POSTGRES_USER: quant_app
      POSTGRES_PASSWORD: q123456
      POSTGRES_PORT: 5432

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Start POSTGRES_DB
        run: docker compose up -d --wait postgres

      - name: Run database migrations 
        run: docker compose --profile tools run --rm flyway migrate


      - name: Run tests
        env:
          PYTHONPATH: .
          TEST_DATABASE_URL: postgresql://quant_app:q123456@localhost:5432/quant_platform_test
        run: python -m pytest -v

      - name: Tear down Postgres
        if: always()
        run: docker compose down -v
